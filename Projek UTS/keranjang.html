<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Keranjang</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="nasywa_header">
        <h4 class="nasywa_logo">nanaybakery</h4>
        <nav class="nasywa_nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="katalog.html">Katalog</a></li>
                <li><a href="promo.html">Promo</a></li>
                <li>
                    <a href="keranjang.html" class="aktif">
                        <i class="bi bi-cart3"></i>
                    </a>
                </li>
                <li>
                    <a href="contact.html">
                        <i class="bi bi-telephone-fill"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="nasywa_judul_keranjang">
            <h2>Keranjang Belanja</h2>
            <p>Periksa kembali pesanan favoritmu sebelum checkout.</p>
        </section>

        <section class="nasywa_konten_keranjang">
            <div class="nasywa_tabel_keranjang">
                <table>
                    <thead>
                        <tr>
                            <th>Produk</th>
                            <th>Harga</th>
                            <th>Jumlah</th>
                            <th>Subtotal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="nasywa_isiKeranjang">
                    </tbody>
                </table>
            </div>

            <section class="nasywa_ringkasan_keranjang">
                <h3>Ringkasan Belanja</h3>
                <div class="nasywa_detail_total">
                    <p>Subtotal</p>
                    <p id="nasywa_subtotal">Rp0</p>
                </div>

                <div class="nasywa_total_akhir">
                    <h3>Total</h3>
                    <h3 id="nasywa_totalharga">Rp0</h3>
                </div>

                <a href="checkout.html" class="nasywa_tombol_checkout">
                    Lanjut Checkout
                </a>
            </section>
        </section>

        <section class="nasywa_kembali_katalog">
            <a href="katalog.html">
                <i class="bi bi-arrow-left"></i> Kembali Belanja
            </a>
        </section>

    </main>

    <footer class="nasywa_footer">
        <p>&copy; 2026 nanaybakery</p>
    </footer>

</body>
</html>
